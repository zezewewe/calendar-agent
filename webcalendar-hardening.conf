# WebCalendar hardening applied by Dockerfile.webcalendar.
#
# The installer, CLI tools and docs are still shipped in the image so
# `php wizard/headless.php` works for provisioning, but none of them need to be
# reachable over HTTP after installation.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html/wizard>
    Require all denied
</Directory>

<Directory /var/www/html/tools>
    Require all denied
</Directory>

<Directory /var/www/html/docs>
    Require all denied
</Directory>

<FilesMatch "(?i)^(security_audit\.php|SECURITY_AUDIT_STATUS\.md|composer\.(json|lock))$">
    Require all denied
</FilesMatch>
