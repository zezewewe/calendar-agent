[project]
name = "calendar-agent"
version = "0.1.0"
description = "Forward messages, event screenshots and WhatsApp chats to a bot; it proposes calendar events and adds them once you confirm."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "openai>=1.40"]

[project.optional-dependencies]
google = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
telegram = ["python-telegram-bot>=21"]
dev = ["pytest>=8"]

[project.scripts]
calendar-agent = "calendar_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
